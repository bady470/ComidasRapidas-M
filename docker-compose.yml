# Levanta la plataforma completa (frontend + backend en un solo contenedor) y PostgreSQL.
# Arráncalo con:  docker compose up -d --build
#
# PostgreSQL arranca con la base de control (db_leinei_control). La app crea sola la plantilla
# (db_leinei_plantilla) y, cada vez que el superadmin crea una empresa, su base db_cliente_<identificador>.
services:
  db:
    image: postgres:17
    container_name: leinei-db
    environment:
      POSTGRES_DB: db_leinei_control
      # Usuario OWNER de la plataforma: crea bases y roles (en producción, uno con CREATEDB y CREATEROLE, no superusuario).
      POSTGRES_USER: leinei
      POSTGRES_PASSWORD: leinei
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - leinei-datos:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leinei -d db_leinei_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leinei-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_OWNER_USER: leinei
      DB_OWNER_PASSWORD: leinei
      # Cifra las claves de la base de cada empresa. Cámbiala y guárdala: si se pierde, no se pueden abrir esas bases.
      LEINEI_LLAVE_MAESTRA: cambia-esta-llave-maestra-por-una-larga
      # Primer superadmin (solo se crea si no existe ninguno). Cambia la clave al entrar: /superadmin → Mi cuenta.
      SUPERADMIN_USER: superadmin
      SUPERADMIN_NAME: Superadministrador
      SUPERADMIN_PASSWORD: cambia-esta-clave
      # Mismo origen para frontend y API: no hace falta configurar CORS_ORIGINS.
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  leinei-datos:
