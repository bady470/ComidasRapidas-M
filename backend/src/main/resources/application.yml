spring:
  application:
    name: leinei-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leinei}
    username: ${DB_USER:leinei}
    password: ${DB_PASSWORD:leinei}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway maneja el esquema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: always

leinei:
  zona-horaria: America/Bogota
  # Orígenes que pueden llamar la API (el frontend). Separa varios con coma.
  cors-origenes: ${CORS_ORIGINS:http://localhost:4200}
  # Usuario administrador que se crea la primera vez que arranca la API, si no existe ninguno.
  admin-inicial:
    usuario: ${ADMIN_USER:admin}
    nombre: ${ADMIN_NAME:Administrador}
    clave: ${ADMIN_PASSWORD:cambia-esta-clave}
  # Horas que dura la sesión del administrador.
  sesion-horas: 12
