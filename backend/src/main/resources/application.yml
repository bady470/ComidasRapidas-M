spring:
  application:
    name: leinei-api
  jpa:
    open-in-view: false
    # Las entidades de la tienda viven en la base de cada empresa. Hibernate no se conecta al arrancar
    # (todavía no hay empresa elegida); por eso se le indica el dialecto.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none   # Liquibase es la única fuente de verdad de la estructura
    properties:
      hibernate:
        boot.allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false     # las migraciones las corre la plataforma al arrancar (ver ArranquePlataforma)
  sql:
    init:
      mode: never      # sin schema.sql/data.sql: la estructura la manejan las migraciones de la plataforma
  mail:
    # El correo es opcional: solo se envía si defines MAIL_HOST (spring.mail.host). Ver README.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 8000
      mail.smtp.writetimeout: 8000
  servlet:
    multipart:
      max-file-size: 6MB      # comprobantes de pago hasta 5 MB (imágenes del menú: 2 MB)
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  # Detrás de Nginx (imagen del frontend) o de un balanceador: usa X-Forwarded-Host/Proto para saber
  # el origen real de la petición (CORS, direcciones absolutas).
  forward-headers-strategy: framework
  error:
    include-message: always

leinei:
  zona-horaria: America/Bogota
  # Dirección pública de la plataforma (la que usa el navegador). Va en los correos de bienvenida.
  url-publica: ${PUBLIC_URL:http://localhost:8080}
  # Remitente de los correos. Si se deja vacío se usa el usuario SMTP.
  correo-remitente: ${MAIL_FROM:}
  # Orígenes que pueden llamar la API cuando el frontend se sirve aparte. Separa varios con coma.
  cors-origenes: ${CORS_ORIGINS:http://localhost:4200}
  # Horas que dura una sesión (superadmin y portal de empresa).
  sesion-horas: 12
  plataforma:
    host: ${DB_HOST:localhost}
    puerto: ${DB_PORT:5432}
    # En producción: sslmode=verify-full (con el certificado del servidor).
    parametros: ${DB_PARAMS:}
    base-control: ${DB_CONTROL:db_leinei_control}
    base-plantilla: ${DB_PLANTILLA:db_leinei_plantilla}
    # Credenciales OWNER: crean bases y roles, y corren migraciones. Necesitan CREATEDB y CREATEROLE.
    usuario-owner: ${DB_OWNER_USER:leinei}
    clave-owner: ${DB_OWNER_PASSWORD:leinei}
    # Credenciales APP para la base de control (solo datos). Si se dejan vacías, se usa el owner.
    usuario-app: ${DB_APP_USER:}
    clave-app: ${DB_APP_PASSWORD:}
    # Llave con la que se cifran las credenciales de cada empresa. Guárdala bien: si se pierde,
    # no se pueden descifrar las conexiones ya creadas.
    llave-maestra: ${LEINEI_LLAVE_MAESTRA:solo-para-desarrollo-cambiala}
    # Conexiones abiertas como máximo por empresa. En producción, delante de un pooler (PgBouncer / RDS Proxy).
    pool-por-empresa: ${POOL_POR_EMPRESA:4}
    # Pon false para correr el aprovisionamiento en un proceso aparte con sus propias credenciales owner.
    aprovisionamiento-habilitado: ${APROVISIONAMIENTO_HABILITADO:true}
  superadmin-inicial:
    usuario: ${SUPERADMIN_USER:superadmin}
    nombre: ${SUPERADMIN_NAME:Superadministrador}
    clave: ${SUPERADMIN_PASSWORD:cambia-esta-clave}
