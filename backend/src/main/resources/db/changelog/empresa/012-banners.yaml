# Banners del carrusel de la portada de la tienda: los arma y ordena el administrador desde su portal.
databaseChangeLog:
  - changeSet:
      id: empresa-012-banners
      author: leinei
      changes:
        - sql:
            sql: |
              CREATE TABLE producto.tbl_banners (
                  id         BIGSERIAL PRIMARY KEY,
                  uuid       UUID         NOT NULL DEFAULT gen_random_uuid() UNIQUE,
                  titulo     VARCHAR(80)  NOT NULL,
                  subtitulo  VARCHAR(200) NOT NULL DEFAULT '',
                  boton      VARCHAR(30)  NOT NULL DEFAULT '',
                  archivo_id BIGINT REFERENCES producto.tbl_archivos(id) ON DELETE SET NULL,
                  color      VARCHAR(7)   NOT NULL DEFAULT '',
                  es_activo  BOOLEAN      NOT NULL DEFAULT TRUE,
                  orden      INTEGER      NOT NULL DEFAULT 0,
                  creado_en  TIMESTAMPTZ  NOT NULL DEFAULT now()
              );
              CREATE TRIGGER trg_auditar_banners AFTER INSERT OR UPDATE OR DELETE ON producto.tbl_banners FOR EACH ROW EXECUTE FUNCTION plataforma.fn_auditar();
      rollback:
        - sql: { sql: "DROP TABLE producto.tbl_banners" }
