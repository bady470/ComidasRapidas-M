# Plantilla: Nginx reemplaza ${API_URL} al arrancar el contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Logos y fotos de hasta 2 MB (con margen para el multipart).
    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → contenedor del backend. Se conserva el dominio original (tiendas con dominio propio).
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular (/{empresa}, /{empresa}/admin, /superadmin…) → index.html, siempre fresco.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
