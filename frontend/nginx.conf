# Plantilla: Nginx reemplaza ${API_URL} al arrancar el contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Logos y fotos de hasta 2 MB y comprobantes de pago de hasta 5 MB (con margen para el multipart).
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tiempo real (Server-Sent Events): sin búfer y con conexiones largas.
    location ~ ^/api/.+/eventos$ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # API → contenedor del backend. Se conserva el dominio y el puerto originales (tiendas con dominio propio).
    location /api/ {
        proxy_pass ${API_URL};
        proxy_http_version 1.1;
        # $http_host conserva el puerto (localhost:8080). Con $host el backend vería "localhost" sin puerto,
        # creería que la petición viene de otro origen (CORS) y respondería 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de Angular (/{empresa}, /{empresa}/admin, /superadmin…) → index.html, siempre fresco.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
